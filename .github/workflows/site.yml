name: Site

# Publica `site/` no Cloudflare Pages, no projeto `open-labs-brasil`, como o
# datasus-viz. A página lê a versão da especificação e o resultado da suíte de
# arquivos fora de `site/`, por isso esses arquivos também disparam a
# publicação. CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID são segredos da
# organização.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'especificacao/00-indice.md'
      - 'docs/cobertura-de-requisitos.md'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez, sem cancelar a que já começou.
concurrency:
  group: site
  cancel-in-progress: false

env:
  PROJETO: open-labs-brasil

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.18'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/dist
          if-no-files-found: error

  # Job separado, sem o checkout: o wrangler-action instala o wrangler com
  # `npm i` no diretório de trabalho, e o npm falha dentro da árvore de
  # node_modules do pnpm ("Cannot read properties of null (reading
  # 'matches')"). O datasus-viz publica do mesmo jeito.
  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site/dist
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.18'

      # O `pages deploy` não cria o projeto em ambiente não interativo. Na
      # primeira publicação ele é criado aqui; nas seguintes, a consulta acha
      # o projeto e nada muda. Qualquer resposta que não seja 200 nem 404
      # interrompe a publicação.
      - name: Garantir o projeto no Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          status=$(curl -s -o /tmp/projeto.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/${PROJETO}")
          if [ "$status" = "404" ]; then
            status=$(curl -s -o /tmp/projeto.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${PROJETO}\",\"production_branch\":\"main\"}" "${api}")
          fi
          if [ "$status" != "200" ]; then
            echo "Cloudflare respondeu ${status}:"
            cat /tmp/projeto.json
            exit 1
          fi
          subdominio=$(jq -r '.result.subdomain' /tmp/projeto.json)
          echo "Endereço: https://${subdominio}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy site/dist --project-name=${{ env.PROJETO }} --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.sha }}"
