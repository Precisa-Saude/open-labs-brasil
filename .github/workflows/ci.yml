name: CI

# Esta entrada pertence ao repositório. As implementações compartilhadas são
# chamadas por SHA; o Renovate propõe atualizações com revisão e CI.
#
# O _checks.yml compartilhado roda commitlint no título do PR, lint,
# typecheck, format:check, build e test. O script adicional, `conferir`,
# roda a suíte de conformidade contra o servidor de exemplo e confere os
# links dos arquivos Markdown. Não há release nem pacote no npm. O site é
# publicado no GitHub Pages por `site.yml`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number for a manual review re-run'
        required: false
        type: number

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    permissions:
      contents: read
    uses: Precisa-Saude/tooling/.github/workflows/_checks.yml@5c10f72e4f4bfe0b06884b68d871b49d4f4b54fb # v3.5.1
    with:
      # 22.18 é o mínimo de `engines`, o primeiro Node que executa TypeScript direto.
      node_version: '22.18'
      test_script: conferir

  review:
    permissions:
      contents: read
      issues: read
      pull-requests: write
      models: read
    needs: checks
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number > 0)
    uses: Precisa-Saude/tooling/.github/workflows/review.yml@5c10f72e4f4bfe0b06884b68d871b49d4f4b54fb # v3.5.1
    with:
      # Converte o valor recebido por workflow_dispatch para o tipo number.
      pr_number: ${{ fromJSON(github.event.pull_request.number || inputs.pr_number || 0) }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
