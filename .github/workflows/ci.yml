name: CI

# Roda `pnpm verificar` em todo PR e em todo push no ramo principal: tipos,
# testes, suíte de conformidade contra o servidor de exemplo e links dos
# arquivos Markdown. É o mesmo comando que se roda na máquina
# (docs/servidor-e-suite.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Verificar (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.18 é o mínimo declarado em `engines`, o primeiro que executa
        # TypeScript direto. 24 é a linha em uso no desenvolvimento.
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # O gerador do ambiente local usa o `openssl` do sistema, que a imagem
      # do runner já traz.
      - run: pnpm verificar
